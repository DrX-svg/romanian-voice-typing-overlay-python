name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  native-ctest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install cmake ninja
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: amd64
      - run: cmake -S native -B native/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build native/build
      - run: ctest --test-dir native/build --output-on-failure

  torch-ext:
    runs-on: ubuntu-latest
    env:
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt setuptools wheel ninja
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python native/torch_ext/setup.py build_ext --inplace
      - name: Require compiled operators
        run: python -c "import torch, vt_dsp_torch; assert issubclass(vt_dsp_torch.FrameRms, torch.autograd.Function)"
      - run: python -m pytest -v
